# Execução em AWS. Sem valores por omissão de propósito: se uma variável faltar,
# a aplicação não arranca, em vez de arrancar apontada ao sítio errado.
spring:
  datasource:
    url: ${DOCGRID_DB_URL}
    username: ${DOCGRID_DB_USER}
    password: ${DOCGRID_DB_PASSWORD}
  jpa:
    show-sql: false

docgrid:
  queue:
    name: ${DOCGRID_QUEUE}
    dlq-name: ${DOCGRID_DLQ}
    region: ${AWS_REGION}
    # Sem endpoint nem credenciais fixas: o SQS real e a cadeia de credenciais do ECS.
    endpoint: ""
    access-key: ""
    secret-key: ""
  storage:
    bucket: ${DOCGRID_BUCKET}
    region: ${AWS_REGION}
    # Sem endpoint nem credenciais fixas: o S3 real e a cadeia de credenciais do ECS.
    endpoint: ""
    access-key: ""
    secret-key: ""
