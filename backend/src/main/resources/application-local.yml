# Desenvolvimento local contra o docker compose deste repositório.
# Os valores por omissão correspondem aos containers efémeros do `docker-compose.yml`;
# não são credenciais de nada que exista fora da máquina de quem desenvolve.
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:docgrid}
    username: ${POSTGRES_USER:docgrid}
    password: ${POSTGRES_PASSWORD:docgrid}

docgrid:
  queue:
    # O LocalStack do docker compose. As credenciais são fictícias por exigência do
    # próprio LocalStack — aceita qualquer valor.
    endpoint: ${DOCGRID_SQS_ENDPOINT:http://localhost:4566}
    access-key: ${AWS_ACCESS_KEY_ID:test}
    secret-key: ${AWS_SECRET_ACCESS_KEY:test}
  storage:
    endpoint: ${DOCGRID_S3_ENDPOINT:http://localhost:4566}
    access-key: ${AWS_ACCESS_KEY_ID:test}
    secret-key: ${AWS_SECRET_ACCESS_KEY:test}
  jwt:
    # Fixo e óbvio de propósito, tal como as credenciais do LocalStack acima: nunca é o
    # segredo de nada que exista fora da máquina de quem desenvolve.
    secret: ${JWT_SECRET:desenvolvimento-local-docgrid-nao-usar-em-producao-32bytes}

logging:
  level:
    com.docgrid: DEBUG
