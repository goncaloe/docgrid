# Configuração comum a todos os perfis. Nada aqui é específico de um ambiente
# e nada aqui é segredo: credenciais chegam sempre por variável de ambiente.
spring:
  application:
    name: docgrid
  profiles:
    default: local
    group:
      # Em local, um só processo corre a API e o worker da fila. Em AWS são
      # serviços separados: `aws` sozinho para a API, `aws,worker` para o worker.
      # Ver docs/adr/0008-escolha-de-sqs-e-desenho-do-worker.md.
      local: worker
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    # Erros saem como application/problem+json (RFC 7807), com tipo e título uniformes —
    # ver com.docgrid.shared.GlobalExceptionHandler.
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

docgrid:
  jwt:
    # Sem valor por omissão de propósito: a regra 4 do AGENTS.md é sem segredos no
    # repositório, e um segredo com omissão previsível não protege nada em produção.
    secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}
  queue:
    name: ${DOCGRID_QUEUE:docgrid-document-processing}
    dlq-name: ${DOCGRID_DLQ:docgrid-document-processing-dlq}
    region: ${AWS_REGION:eu-west-1}
    # Vazio ⇒ AWS real. O perfil `local` aponta isto ao LocalStack; os testes, ao container.
    endpoint: ${DOCGRID_SQS_ENDPOINT:}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    # Entregas antes de a mensagem desistir. Tem de bater certo com o maxReceiveCount da
    # política de redrive que a infraestrutura cria na fila — ver ADR 0008.
    max-receive-count: 3
    # Long polling: uma espera vazia é barata, um ciclo curto é puro custo.
    wait-time: 10s
  storage:
    bucket: ${DOCGRID_BUCKET:docgrid-documents}
    region: ${AWS_REGION:eu-west-1}
    # Vazio ⇒ AWS real (endpoint da região, credenciais da cadeia por omissão).
    # O perfil `local` aponta isto ao LocalStack; os testes, ao container.
    endpoint: ${DOCGRID_S3_ENDPOINT:}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
  upload:
    # Validade dos URLs pré-assinados: curta, é só o tempo de o browser fazer o upload.
    url-ttl: 5m
    max-file-size: 10MB
    # Content-Type aceite → extensão canónica do ficheiro. As chaves vão entre
    # aspas e parênteses retos: sem isso, o Spring remove a barra do MIME.
    allowed-types:
      "[application/pdf]": pdf
      "[image/jpeg]": jpg
      "[image/png]": png

  extraction:
    # A fixture que o stub devolve (perfil local/test). Trocar o caminho troca o caso
    # simulado — fatura limpa, foto tremida, campo em falta — sem tocar em código.
    stub-fixture: ${DOCGRID_STUB_FIXTURE:extraction/fixtures/clean-invoice.json}
    textract:
      region: ${AWS_REGION:eu-west-1}
      # Vazio ⇒ AWS real. O cliente do Textract só existe no perfil aws; local e test
      # usam o stub (o LocalStack não tem Textract).
      endpoint: ${DOCGRID_TEXTRACT_ENDPOINT:}
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
      # Uma análise que estoura isto falha como erro transitório e o SQS volta a tentar.
      api-timeout: 60s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Sem autenticação, o corpo é apenas {"status":"UP"}. Detalhes de
      # infraestrutura não se expõem a quem não está autenticado.
      # As probes de liveness e readiness chegam na etapa 11, com o ECS.
      show-details: when-authorized

logging:
  level:
    com.docgrid: INFO
  pattern:
    # Um id de correlação que atravessa a API e o worker: o documento. Quem o põe
    # no MDC é o serviço de upload (API) e o DocumentProcessor (worker); `msg` é o
    # id da mensagem SQS, só do lado do worker. A etapa 10 troca isto por logs
    # estruturados a sério.
    level: "%5p [doc=%X{documentId:-} msg=%X{messageId:-}]"
