# Testes de integração. A ligação à base de dados vem do Testcontainers através
# de @ServiceConnection — não se configura aqui, e nunca aponta para um Postgres
# da máquina de quem corre os testes.
spring:
  flyway:
    clean-disabled: true

docgrid:
  jwt:
    # Fixo, só para os testes assinarem e validarem tokens sem depender de variável de
    # ambiente nenhuma.
    secret: testes-docgrid-segredo-fixo-sem-significado-32bytes
    access-token-ttl: 15m
    refresh-token-ttl: 30d

logging:
  level:
    org.testcontainers: INFO
    com.docgrid: DEBUG
