# Multi-architecture image pushed to ghcr.io.
# Two native build jobs (amd64 on ubuntu-latest, arm64 on the GitHub ARM runner - free
# on a public repository), each pushing by digest, and one final job composing the
# multi-platform manifest with `buildx imagetools create`. No QEMU: emulated arm64
# builds take 8-10 minutes. Authentication is the GITHUB_TOKEN - no secret to manage.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            digest-tag: amd64
          # Public repository: the ARM runner is free. If the repo goes private,
          # drop this row (see stage-11 plan, "Passo 9").
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            digest-tag: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.digest-tag }}

  merge:
    name: Compose multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest (latest + sha)
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}-arm64